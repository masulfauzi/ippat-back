host: localhost:3000
info:
  contact:
    name: IPPAT Backend Team
  description: |-
    REST API untuk platform ujian online IPPAT (Fiber + GORM + PostgreSQL). Semua response dibungkus format {success, message, data, errors}.
    Endpoint yang butuh login (guru/admin/peserta) ditandai kunci gembok di UI ini — klik "Authorize" dan isi `Bearer <token>` yang didapat dari /api/auth/login atau /api/auth/register.
  license:
    name: Proprietary
  title: IPPAT Backend API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login untuk user (guru/admin) maupun peserta menggunakan username
        & password. Mengembalikan JWT token yang dipakai sebagai Bearer token di endpoint
        lain.
      parameters:
      - description: Kredensial login
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.Response'
      summary: Login
      tags:
      - Auth
  /auth/me:
    get:
      description: Mengembalikan data profil sesuai token JWT yang dikirim (mendukung
        role user maupun peserta).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.CurrentUserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/helpers.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Profil user yang sedang login
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Membuat akun user (guru/admin) baru. Untuk akun peserta, gunakan
        endpoint POST /peserta.
      parameters:
      - description: Data registrasi
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
      summary: Registrasi user baru
      tags:
      - Auth
  /bank-soal:
    get:
      parameters:
      - default: 1
        description: Nomor halaman
        in: query
        name: page
        type: integer
      - default: 10
        description: Jumlah data per halaman
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.BankSoalListResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.Response'
      summary: List bank soal
      tags:
      - Bank Soal
    post:
      consumes:
      - application/json
      parameters:
      - description: Data bank soal
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBankSoalRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.BankSoalResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Buat bank soal baru
      tags:
      - Bank Soal
  /bank-soal/{id}:
    delete:
      parameters:
      - description: ID Bank Soal
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.Response'
      security:
      - BearerAuth: []
      summary: Hapus (soft delete) bank soal
      tags:
      - Bank Soal
    get:
      parameters:
      - description: ID Bank Soal
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/helpers.Response'
